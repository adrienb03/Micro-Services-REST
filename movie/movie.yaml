
openapi: 3.0.3

info:
  title: Movie Service API
  description: API for browsing, adding, and deleting movies.
  version: "1.0.0"

servers:
  - url: http://localhost:3200
    description: Local development server

tags:
  - name: admin
    description: Secured Admin-only calls
  - name: dev
    description: Public operations available without authentication

paths:
  /json:
    get:
      tags:
        - dev
      summary: Retrieve the full list of movies
      description: Returns all available movies.
      responses:
        "200":
          description: List of movies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
              example:
                - title: "The Good Dinosaur"
                  rating: 7.4
                  director: "Peter Sohn"
                  id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                - title: "The Martian"
                  rating: 8.2
                  director: "Ridley Scott"
                  id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                - title: "The Night Before"
                  rating: 7.4
                  director: "Jonathan Levine"
                  id: "96798c08-d19b-4986-a05d-7da856efb697"
                - title: "Creed"
                  rating: 8.8
                  director: "Ryan Coogler"
                  id: "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
                - title: "Victor Frankenstein"
                  rating: 6.4
                  director: "Paul McGuigan"
                  id: "7daf7208-be4d-4944-a3ae-c1c2f516f3e6"
                - title: "The Danish Girl"
                  rating: 5.3
                  director: "Tom Hooper"
                  id: "276c79ec-a26a-40a6-b3d3-fb242a5947b6"
                - title: "Spectre"
                  rating: 7.1
                  director: "Sam Mendes"
                  id: "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
                - title: "Test"
                  rating: 1.2
                  director: "Someone"
                  id: "xxx"

  /movies/{movieid}:
    get:
      tags:
        - dev
      summary: Retrieve a movie by its ID
      description: Returns the movie corresponding to the specified identifier.
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                title: "The Good Dinosaur"
                rating: 7.4
                director: "Peter Sohn"
                id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie ID not found"

    post:
      tags:
        - admin
      summary: Add a new movie
      description: >
        Adds a new movie with the specified ID.
        The ID must not already exist.
        Requires administrator privileges.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        required: true
        description: Information about the movie to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Movie"
            example:
              title: "New Movie"
              rating: 7.5
              director: "New Director"
              id: "new-movie-id"
      responses:
        "201":
          description: Movie added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "movie added"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Movie ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "movie ID already exists"

    delete:
      tags:
        - admin
      summary: Delete a movie
      description: >
        Deletes the movie corresponding to the specified ID.
        Requires administrator privileges.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                title: "Test"
                rating: 1.2
                director: "Someone"
                id: "xxx"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "movie ID not found"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT provided in the Authorization header.
        Administrator privileges are required for protected operations.

    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token_cookie
      description: >
        JWT provided in the access_token_cookie.
        State-changing requests authenticated via cookies
        also require a valid CSRF token by default.

  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Unique identifier of the movie.
      schema:
        type: string
        example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"

  schemas:
    Movie:
      type: object
      description: Representation of a movie.
      properties:
        id:
          type: string
          description: Unique identifier of the movie.
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          description: Movie title.
          example: "The Good Dinosaur"
        rating:
          type: number
          format: float
          description: Rating assigned to the movie.
          example: 7.4
        director:
          type: string
          description: Movie director.
          example: "Peter Sohn"
      required:
        - id
        - title
        - rating
        - director

    Message:
      type: object
      description: Successful operation response.
      properties:
        message:
          type: string
          description: Confirmation message.
          example: "movie added"
      required:
        - message

    Error:
      type: object
      description: Error response.
      properties:
        error:
          type: string
          description: Explanation of the error.
          example: "Movie ID not found"
      required:
        - error

  responses:
    Unauthorized:
      description: Missing or invalid JWT.

    Forbidden:
      description: Administrator privileges required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Forbidden"
